<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iStar - App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0c0f14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        .phone-container {
            width: 393px;
            height: 852px;
            background-color: #000;
            border-radius: 40px;
            border: 8px solid #252932;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        /* شريط الرصيد العلوي */
        .top-balance-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .top-balance-bar i { color: #ffca28; font-size: 18px; }
        .balance-text { font-weight: bold; font-size: 14px; }

        /* الشاشات الأساسية */
        .screen {
            width: 100%;
            height: calc(100% - 70px); /* مساحة للشريط السفلي */
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            padding-top: 70px;
        }

        .active-screen { display: flex; flex-direction: column; }

        /* شاشة 1: خلاصة الفيديوهات */
        #videoScreen {
            padding-top: 0;
            background: #111;
        }
        .video-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.1) 60%, rgba(0,0,0,0.9) 100%), 
                        url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1964&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
        .side-buttons {
            position: absolute;
            bottom: 40px;
            right: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 4;
        }
        .action-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .action-item i { font-size: 28px; margin-bottom: 5px; }
        .fa-heart { color: #ff3b30; }
        .video-details { position: absolute; bottom: 40px; left: 15px; right: 80px; z-index: 4; text-align: right; }

        /* شاشة 2: قائمة الحلقات */
        #episodesScreen {
            background-color: #12161f;
            padding: 80px 20px 20px 20px;
        }
        .screen-title { font-size: 22px; font-weight: bold; margin-bottom: 20px; color: #ffca28; }
        
        .episode-list { display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        
        .episode-card {
            background: #1a202c;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2d3748;
            cursor: pointer;
        }
        .episode-info { display: flex; flex-direction: column; gap: 5px; }
        .ep-title { font-weight: bold; font-size: 16px; }
        .ep-duration { font-size: 12px; color: #a0a5b5; }
        
        .status-badge {
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .status-free { background-color: #2e7d32; color: #fff; }
        .status-locked { background-color: #e65100; color: #fff; }
        .status-unlocked { background-color: #0288d1; color: #fff; }

        /* شاشة 3: متجر العملات */
        #shopScreen {
            background-color: #12161f;
            padding: 80px 20px 20px 20px;
        }
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .coin-card {
            background: #1a202c; border-radius: 20px; padding: 20px; text-align: center;
            border: 1px solid #2d3748; cursor: pointer;
        }
        .coin-card i { font-size: 30px; color: #ffca28; margin-bottom: 10px; }
        .coin-price { display: inline-block; background: #ff9800; color: #000; padding: 3px 12px; border-radius: 10px; font-size: 12px; font-weight: bold; margin-top: 5px; }

        /* الشريط السفلي للتنقل ثابت */
        .bottom-nav {
            height: 70px;
            background-color: #1a202c;
            border-top: 1px solid #2d3748;
            display: flex;
            justify-content: space-around;
            align-items: center;
            position: absolute;
            bottom: 0;
            width: 100%;
            z-index: 10;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #718096;
            cursor: pointer;
            font-size: 12px;
            gap: 4px;
        }
        .nav-item.active { color: #ffca28; }
        .nav-item i { font-size: 20px; }
    </style>
</head>
<body>

    <div class="phone-container">
        
        <!-- رصيد العملات الثابت علوياً -->
        <div class="top-balance-bar">
            <i class="fas fa-coins"></i>
            <span class="balance-text">رصيدك: <span id="userBalance">0</span> عملة</span>
        </div>

        <!-- شاشة 1: الفيديو الرئيسي -->
        <div class="screen active-screen" id="videoScreen">
            <div class="video-placeholder"></div>
            <div class="side-buttons">
                <div class="action-item"><i class="fas fa-heart"></i><span>2.4K</span></div>
                <div class="action-item"><i class="fas fa-comment-dots"></i><span>142</span></div>
            </div>
            <div class="video-details">
                <div class="username">@iStar_Premium</div>
                <div class="description">انتقل لشاشة "الحلقات" من الشريط السفلي لتجربة نظام القفل الذكي! 🪙🎬</div>
            </div>
        </div>

        <!-- شاشة 2: قائمة الحلقات والمسلسلات -->
        <div class="screen" id="episodesScreen">
            <div class="screen-title">حلقات مسلسل "الهروب" 🎬</div>
            <div class="episode-list">
                
                <!-- حلقة مجانية -->
                <div class="episode-card" onclick="playEpisode(1, 0)">
                    <div class="episode-info">
                        <span class="ep-title">الحلقة 1: البداية المفاجئة</span>
                        <span class="ep-duration">⏱️ 2:15 دقيقة</span>
                    </div>
                    <span class="status-badge status-free">مجانية</span>
                </div>

                <!-- حلقة مدفوعة -->
                <div class="episode-card" id="ep2-card" onclick="playEpisode(2, 20)">
                    <div class="episode-info">
                        <span class="ep-title">الحلقة 2: كشف المستور</span>
                        <span class="ep-duration">⏱️ 1:45 دقيقة</span>
                    </div>
                    <span class="status-badge status-locked" id="ep2-status">
                        <i class="fas fa-lock"></i> 20 عملة
                    </span>
                </div>

            </div>
        </div>

        <!-- شاشة 3: متجر شحن العملات -->
        <div class="screen" id="shopScreen">
            <div class="screen-title">شحن رصيد عملات 🪙</div>
            <div class="shop-grid">
                <div class="coin-card" onclick="buyCoins(50)">
                    <i class="fas fa-coins"></i><div>50 عملة</div><span class="coin-price">10 ج</span>
                </div>
                <div class="coin-card" onclick="buyCoins(200)">
                    <i class="fas fa-box-open"></i><div>200 عملة</div><span class="coin-price">30 ج</span>
                </div>
            </div>
        </div>

        <!-- الشريط السفلي للتنقل (Navigation Bar) -->
        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchScreen('videoScreen', this)">
                <i class="fas fa-home"></i><span>الرئيسية</span>
            </div>
            <div class="nav-item" onclick="switchScreen('episodesScreen', this)">
                <i class="fas fa-film"></i><span>الحلقات</span>
            </div>
            <div class="nav-item" onclick="switchScreen('shopScreen', this)">
                <i class="fas fa-store"></i><span>المتجر</span>
            </div>
        </div>

    </div>

    <script>
        let currentBalance = 0; // رصيد المستخدم الحالي
        let ep2Unlocked = false; // حالة قفل الحلقة الثانية

        // دالة التنقل بين الشاشات
        function switchScreen(screenId, element) {
            // إخفاء كل الشاشات
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            // إظهار الشاشة المطلوبة
            document.getElementById(screenId).classList.add('active-screen');
            
            // تحديث شكل الزرار النشط في القائمة السفلية
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }

        // دالة شحن العملات من المتجر
        function buyCoins(amount) {
            currentBalance += amount;
            document.getElementById('userBalance').innerText = currentBalance;
            alert('تم شحن ' + amount + ' عملة بنجاح! 🪙');
        }

        // دالة تشغيل الحلقات ونظام الخصم
        function playEpisode(epNum, price) {
            if (epNum === 1) {
                alert('جاري تشغيل الحلقة 1 المجانية... استمتع بالمشاهدة! 🎬');
                switchScreen('videoScreen', document.querySelectorAll('.nav-item')[0]);
                return;
            }

            if (epNum === 2) {
                // لو الحلقة متبرمجة إنها اتفتحت خلاص قبل كده
                if (ep2Unlocked) {
                    alert('الحلقة مفتوحة بالفعل! جاري التشغيل... 🎬');
                    switchScreen('videoScreen', document.querySelectorAll('.nav-item')[0]);
                    return;
                }

                // لو لسه مقفولة، نشغل عقل السيستم:
                if (currentBalance >= price) {
                    // خصم العملات
                    currentBalance -= price;
                    document.getElementById('userBalance').innerText = currentBalance;
                    ep2Unlocked = true; // تحويل الحالة لمفتوحة
                    
                    // تحديث شكل كارت الحلقة في ثواني
                    const statusBadge = document.getElementById('ep2-status');
                    statusBadge.className = "status-badge status-unlocked";
                    statusBadge.innerHTML = '<i class="fas fa-lock-open"></i> مفتوحة';
                    
                    alert('تم خصم ' + price + ' عملة وفتح الحلقة 2 بنجاح! 🎉');
                    switchScreen('videoScreen', document.querySelectorAll('.nav-item')[0]);
                } else {
                    // لو معاهوش رصيد، السيستم يوجهه للمتجر
                    alert('رصيدك غير كافٍ! تحتاج إلى ' + price + ' عملة. سيتم تحويلك لمتجر الشحن الآن. 🛒');
                    switchScreen('shopScreen', document.querySelectorAll('.nav-item')[2]);
                }
            }
        }
    </script>

</body>
</html>
