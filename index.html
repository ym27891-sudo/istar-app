<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iStar - App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0c0f14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        .phone-container {
            width: 393px;
            height: 852px;
            background-color: #000;
            border-radius: 40px;
            border: 8px solid #252932;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* شريط علوي لعرض الرصيد الحالي للمستخدم */
        .top-balance-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .top-balance-bar i { color: #ffca28; font-size: 18px; }
        .balance-text { font-weight: bold; font-size: 14px; color: #fff; }

        /* الشاشة الأولى: الفيديو */
        .screen {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 0.4s ease;
        }

        #videoScreen {
            background: #111;
            z-index: 1;
        }

        .video-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.1) 60%, rgba(0,0,0,0.9) 100%), 
                        url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1964&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        .side-buttons {
            position: absolute;
            bottom: 120px;
            right: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 4;
        }

        .action-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .action-item i { font-size: 28px; margin-bottom: 5px; }
        .fa-heart { color: #ff3b30; }
        .action-item span { font-size: 12px; font-weight: bold; }

        .coin-btn {
            width: 45px; height: 45px;
            background: linear-gradient(135deg, #ffca28, #ff9800);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.4);
            cursor: pointer;
        }

        .video-details { position: absolute; bottom: 30px; left: 15px; right: 80px; z-index: 4; text-align: right; }
        .username { font-size: 16px; font-weight: bold; margin-bottom: 8px; }
        .description { font-size: 14px; color: #e0e0e0; line-height: 1.4; }

        /* الشاشة الثانية: متجر العملات (مخفية في البداية برة الشاشة) */
        #shopScreen {
            background-color: #12161f;
            z-index: 2;
            transform: translateY(100%); /* منزلة لتحت برة الشاشة */
            padding: 80px 20px 20px 20px;
            display: flex;
            flex-direction: column;
        }

        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .shop-title { font-size: 22px; font-weight: bold; color: #ffca28; }
        .close-shop-btn { font-size: 24px; cursor: pointer; color: #a0a5b5; }

        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            overflow-y: auto;
        }

        /* كروت الشحن */
        .coin-card {
            background: #1a202c;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid #2d3748;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .coin-card:hover {
            transform: scale(1.03);
            border-color: #ffca28;
        }

        .coin-card i {
            font-size: 35px;
            color: #ffca28;
            margin-bottom: 10px;
        }

        .coin-amount { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .coin-price {
            display: inline-block;
            background: #ff9800;
            color: #000;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        
        <!-- شريط الرصيد الثابت فوق -->
        <div class="top-balance-bar">
            <i class="fas fa-coins"></i>
            <span class="balance-text">رصيدك: <span id="userBalance">0</span> عملة</span>
        </div>

        <!-- شاشة الفيديو الأساسية -->
        <div class="screen" id="videoScreen">
            <div class="video-placeholder"></div>
            
            <div class="side-buttons">
                <div class="action-item">
                    <i class="fas fa-heart"></i>
                    <span>2.4K</span>
                </div>
                <div class="action-item">
                    <i class="fas fa-comment-dots"></i>
                    <span>142</span>
                </div>
                <!-- زرار فتح المتجر -->
                <div class="coin-btn" onclick="openShop()">
                    <i class="fas fa-coins"></i>
                </div>
            </div>

            <div class="video-details">
                <div class="username">@iStar_Premium</div>
                <div class="description">اضغط على زرار العملات الذهبية لفتح متجر الشحن وتجربة الـ السيستم الحقيقي! 🪙✨</div>
            </div>
        </div>

        <!-- شاشة متجر العملات (Coin Shop) -->
        <div class="screen" id="shopScreen">
            <div class="shop-header">
                <span class="shop-title">متجر العملات 🪙</span>
                <i class="fas fa-times close-shop-btn" onclick="closeShop()"></i>
            </div>

            <!-- شبكة كروت الشحن -->
            <div class="shop-grid">
                <div class="coin-card" onclick="buyCoins(50)">
                    <i class="fas fa-coins"></i>
                    <div class="coin-amount">50 عملة</div>
                    <div class="coin-price">10 جنيه</div>
                </div>

                <div class="coin-card" onclick="buyCoins(150)">
                    <i class="fas fa-box-open"></i>
                    <div class="coin-amount">150 عملة</div>
                    <div class="coin-price">25 جنيه</div>
                </div>

                <div class="coin-card" onclick="buyCoins(400)">
                    <i class="fas fa-coins"></i><i class="fas fa-coins"></i>
                    <div class="coin-amount">400 عملة</div>
                    <div class="coin-price">60 جنيه</div>
                </div>

                <div class="coin-card" onclick="buyCoins(1000)">
                    <i class="fas fa-gem"></i>
                    <div class="coin-amount">1000 عملة</div>
                    <div class="coin-price">120 جنيه</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // المتغير المسؤول عن حفظ رصيد المستخدم في ذاكرة الصفحة (العقل)
        let currentBalance = 0;

        function openShop() {
            // سحب شاشة المتجر لفوق لتغطي الشاشة
            document.getElementById('shopScreen').style.transform = 'translateY(0)';
        }

        function closeShop() {
            // إنزال شاشة المتجر لتحت لإخفائها والعودة للفيديو
            document.getElementById('shopScreen').style.transform = 'translateY(100%)';
        }

        // دالة الشحن الحقيقية
        function buyCoins(amount) {
            currentBalance += amount; // زيادة الرصيد بقيمة الكارت
            document.getElementById('userBalance').innerText = currentBalance; // تحديث الرقم في الشاشة فوراً
            alert('تم شحن ' + amount + ' عملة بنجاح! 🎉');
        }
    </script>

</body>
</html>
