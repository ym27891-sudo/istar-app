<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iStar - Video Feed</title>
    <!-- استدعاء أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0c0f14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        /* حاوية الموبايل */
        .phone-container {
            width: 393px;
            height: 852px;
            background-color: #000;
            border-radius: 40px;
            border: 8px solid #252932;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* مشغل الفيديو الحقيقي */
        .video-player {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* طبقة تظليل سوداء خفيفة أسفل الفيديو عشان الكلام يبان واضح */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
            z-index: 2;
            pointer-events: none; /* عشان الضغط يمر للفيديو */
        }

        /* زر التشغيل الشفاف في النص */
        .play-overlay-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 70px;
            color: rgba(255, 255, 255, 0.6);
            z-index: 3;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.2s;
            pointer-events: none;
        }

        /* أزرار التفاعل الجانبية */
        .side-buttons {
            position: absolute;
            bottom: 120px;
            right: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 4;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .action-item i {
            font-size: 28px;
            margin-bottom: 5px;
            transition: transform 0.2s;
        }

        .action-item:hover i {
            transform: scale(1.1);
        }

        .action-item span {
            font-size: 12px;
            font-weight: bold;
            color: #e1e1e1;
        }

        .fa-heart { color: #ff3b30; }

        /* زرار العملات */
        .coin-btn {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #ffca28, #ff9800);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.4);
            animation: pulse 2s infinite;
        }

        .coin-btn i {
            font-size: 22px;
            color: #fff;
        }

        /* تفاصيل الفيديو */
        .video-details {
            position: absolute;
            bottom: 30px;
            left: 15px;
            right: 80px;
            z-index: 4;
            text-align: right;
            pointer-events: none;
        }

        .username {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .description {
            font-size: 14px;
            color: #e0e0e0;
            line-height: 1.4;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="phone-container" id="videoContainer">
        <!-- مشغل الفيديو الحقيقي برابط مباشر سريع ودعم التشغيل الصامت المؤقت ومكرر تلقائياً -->
        <video class="video-player" id="myVideo" loop playsinline muted>
            <source src="https://player.vimeo.com/external/371433846.sd.mp4?s=236da2f3c0ee273d1e8d6a134cbc366ad4e2079a&profile_id=165&oauth2_token_id=57447761" type="video/mp4">
            متصفحك لا يدعم تشغيل الفيديو.
        </video>

        <!-- طبقة التظليل الخارجي للجماليات -->
        <div class="overlay"></div>

        <!-- زر التشغيل في المنتصف -->
        <i class="fas fa-play play-overlay-btn" id="playIcon"></i>

        <!-- أزرار التفاعل الجانبية يمين الشاشة -->
        <div class="side-buttons">
            <div class="action-item" onclick="toggleLike(this)">
                <i class="fas fa-heart"></i>
                <span id="likeCount">2.4K</span>
            </div>
            <div class="action-item">
                <i class="fas fa-comment-dots"></i>
                <span>142</span>
            </div>
            <div class="action-item">
                <i class="fas fa-share"></i>
                <span>مشاركة</span>
            </div>
            <div class="coin-btn" onclick="alert('شحن العملات قريباً!')">
                <i class="fas fa-coins"></i>
            </div>
        </div>

        <!-- تفاصيل وصنف الفيديو أسفل الشاشة -->
        <div class="video-details">
            <div class="username">@iStar_Premium</div>
            <div class="description">شاهد الحلقة الأولى من مسلسل "الهروب الكبير" الحصري! اضغط على الشاشة للتشغيل والإيقاف 🪙✨ #drama #shorts</div>
        </div>
    </div>

    <!-- كود التحكم بالتشغيل والـ Logic التفاعلي -->
    <script>
        const video = document.getElementById('myVideo');
        const container = document.getElementById('videoContainer');
        const playIcon = document.getElementById('playIcon');

        // كود تشغيل وإيقاف الفيديو بالضغط على الشاشة
        container.addEventListener('click', function(e) {
            // نتأكد إن الضغطة مش على أزرار التفاعل الجانبية عشان ميعملش تداخل
            if(e.target.closest('.side-buttons')) return;

            if (video.paused) {
                // إلغاء كتم الصوت عند أول ضغطة حقيقية للمستخدم لتفعيل الصوت
                video.muted = false; 
                video.play();
                playIcon.style.opacity = '0'; // إخفاء زر التشغيل
            } else {
                video.pause();
                playIcon.style.opacity = '1'; // إظهار زر التشغيل
            }
        });

        // حركة تفاعلية بسيطة لزرار اللايك
        let liked = false;
        function toggleLike(element) {
            liked = !liked;
            const heartIcon = element.querySelector('i');
            const likeCount = document.getElementById('likeCount');
            if(liked) {
                heartIcon.style.color = '#ff3b30';
                likeCount.innerText = '2.5K';
            } else {
                heartIcon.style.color = '#fff';
                likeCount.innerText = '2.4K';
            }
        }
    </script>

</body>
</html>
