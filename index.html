<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iStar - Video Feed</title>
    <!-- استدعاء أيقونات FontAwesome عشان أزرار التفاعل -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0c0f14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        /* حاوية الموبايل الوهمي عشان تشوف التصميم مظبوط */
        .phone-container {
            width: 393px;
            height: 852px;
            background-color: #000;
            border-radius: 40px;
            border: 8px solid #252932;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* شاشة الفيديو (خلفية نائبة حالياً) */
        .video-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.1) 60%, rgba(0,0,0,0.9) 100%), 
                        url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1964&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .play-btn {
            font-size: 70px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .play-btn:hover {
            transform: scale(1.1);
        }

        /* أزرار التفاعل الجانبية على اليمين */
        .side-buttons {
            position: absolute;
            bottom: 120px;
            right: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .action-item i {
            font-size: 28px;
            margin-bottom: 5px;
            transition: transform 0.2s;
        }

        .action-item:hover i {
            transform: scale(1.1);
        }

        .action-item span {
            font-size: 12px;
            font-weight: bold;
            color: #e1e1e1;
        }

        .fa-heart { color: #ff3b30; }

        /* زرار العملات الذهبية */
        .coin-btn {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #ffca28, #ff9800);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.4);
            animation: pulse 2s infinite;
        }

        .coin-btn i {
            font-size: 22px;
            color: #fff;
            margin: 0;
        }

        /* النصوص التوضيحية أسفل اليسار */
        .video-details {
            position: absolute;
            bottom: 30px;
            left: 15px;
            right: 80px;
            z-index: 10;
            text-align: right;
        }

        .username {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #fff;
        }

        .description {
            font-size: 14px;
            color: #e0e0e0;
            line-height: 1.4;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- منطقة عرض الفيديو -->
        <div class="video-placeholder">
            <i class="fas fa-play play-btn"></i>
        </div>

        <!-- أزرار التفاعل الجانبية -->
        <div class="side-buttons">
            <div class="action-item">
                <i class="fas fa-heart"></i>
                <span>2.4K</span>
            </div>
            <div class="action-item">
                <i class="fas fa-comment-dots"></i>
                <span>142</span>
            </div>
            <div class="action-item">
                <i class="fas fa-share"></i>
                <span>مشاركة</span>
            </div>
            <div class="coin-btn">
                <i class="fas fa-coins"></i>
            </div>
        </div>

        <!-- تفاصيل الفيديو -->
        <div class="video-details">
            <div class="username">@iStar_Premium</div>
            <div class="description">شاهد الحلقة الأولى من مسلسل "الهروب الكبير" الحصري! اضغط على زر العملات للحصول على هدايا يومية 🪙✨ #drama #shorts</div>
        </div>
    </div>

</body>
</html>
